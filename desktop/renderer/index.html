<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ledgr (local)</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; color: #111; }
      h1 { font-size: 1.1rem; }
      #status { color: #555; }
      ul { padding-left: 1.1rem; }
      li { margin: 0.15rem 0; }
    </style>
  </head>
  <body>
    <h1>Ledgr — local desktop (no server)</h1>
    <p id="status">loading…</p>
    <ul id="items"></ul>
    <!--
      Proof slice: the renderer never fetches over HTTP. apiRequest() (in the
      real app) would call window.__ledgrDesktop.request; here we call it
      directly to prove window → IPC → main → @/lib → PGlite works end to end.
    -->
    <script>
      (async () => {
        const status = document.getElementById("status");
        const list = document.getElementById("items");
        try {
          if (!window.__ledgrDesktop) {
            status.textContent = "No desktop bridge on window — preload did not load.";
            return;
          }
          const res = await window.__ledgrDesktop.request({
            method: "GET",
            path: "/api/items?limit=50",
          });
          if (!res.ok) {
            status.textContent = "Request failed: " + res.status;
            return;
          }
          const items = (res.data && res.data.items) || [];
          status.textContent =
            items.length +
            " items from local PGlite  (window → IPC → @/lib → PGlite, no server)";
          for (const it of items) {
            const li = document.createElement("li");
            li.textContent = it.title || "(untitled)";
            list.appendChild(li);
          }
        } catch (e) {
          status.textContent = "Error: " + (e && e.message ? e.message : String(e));
        }
      })();
    </script>
  </body>
</html>
